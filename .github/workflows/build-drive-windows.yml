name: Build Host-ia Windows Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-drive-windows.yml'
      - 'src-tauri/**'
      - 'public/**'
      - 'test/**'
      - 'android/drive-bridge.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: windows-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test JavaScript integration
        run: npm test

      - name: Test native Windows integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installers
        run: npm run tauri:build -- --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Host-ia-Drive-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
